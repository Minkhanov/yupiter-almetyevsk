<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Герб ООО «Юпитер»: две крыши на щите">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242A30"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset=".5" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#B8611E"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#F08A1C"/>
    </linearGradient>
  </defs>
  <!-- щит -->
  <path d="M120 6 226 30v96c0 70-46 122-106 148C60 248 14 196 14 126V30Z" fill="url(#shield)" stroke="url(#rim)" stroke-width="5"/>
  <path d="M120 20 212 41v85c0 61-39 107-92 131-53-24-92-70-92-131V41Z" fill="none" stroke="#F5A623" stroke-opacity=".28" stroke-width="1.2"/>
  <!-- две крыши, как в логотипе компании -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M44 130 98 78l54 52" stroke="url(#roof)" stroke-width="13"/>
    <path d="M118 130l42-40 38 40" stroke="#F4EDE1" stroke-width="10"/>
    <path d="M176 92v-18h12v30" stroke="#F4EDE1" stroke-width="6"/>
  </g>
  <!-- окна под крышами -->
  <g fill="#F4EDE1">
    <rect x="88" y="108" width="9" height="9"/><rect x="100" y="108" width="9" height="9"/>
    <rect x="88" y="120" width="9" height="9"/><rect x="100" y="120" width="9" height="9"/>
    <rect x="152" y="114" width="7" height="7" fill="#F5A623"/><rect x="162" y="114" width="7" height="7" fill="#F5A623"/>
  </g>
  <path d="M40 142h160" stroke="#F5A623" stroke-opacity=".6" stroke-width="2"/>
  <!-- надпись -->
  <text x="120" y="184" text-anchor="middle" font-family="Unbounded, Arial Black, sans-serif" font-weight="800" font-size="27" letter-spacing="1.5" fill="url(#rim)">ЮПИТЕР</text>
  <text x="120" y="207" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="3" fill="#C9D1D8">СТРОИТЕЛЬНАЯ</text>
  <text x="120" y="222" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-weight="700" font-size="10" letter-spacing="3" fill="#C9D1D8">КОМПАНИЯ</text>
</svg>
